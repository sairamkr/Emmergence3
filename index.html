<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#8a8a8a"><title>Squish</title><style>html,body{margin:0;height:100%;background:#8a8a8a}</style></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<!-- Creature paper: forty square fragments cut from the maps in the author's own MapTextures2 collection. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Noto+Serif:ital,wght@1,700&family=Source+Sans+3:wght@500&display=swap">
<style>
/* Layout: one full-screen 3D sheet of graph paper; cells and creatures in WebGL, pencil notes on a canvas above, two pencilled buttons in the corner.
   A single light look on purpose: it is a sheet of paper under a lamp. */
:root {
  --paper: #dbc490;
  --ink: #34353a;
  --soft: #6f6e6a;
  --hand: "Cormorant Garamond", "Cormorant", Garamond, Georgia, serif;
}
html, body { height: 100%; }
body {
  background: var(--paper); color: var(--ink); overflow: hidden; overscroll-behavior: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
}
#stage { position: fixed; inset: 0; }
/* the site's page round the piece: a grey ground, a white Back button and the kind of piece, as on the other pages */
html, body { background: #8a8a8a !important; }
#site { position: fixed; z-index: 3; display: flex; gap: 10px 46px; align-items: center; }
#site.side { flex-direction: column; align-items: flex-end; gap: 22px; }
#back { font: italic 700 21px/1 "Noto Serif", Georgia, serif; color: #4b8fc9; background: #fff; padding: 9px 18px 10px; text-decoration: none; }
#back:hover { color: #2f6fa6; } #back:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
#kind { font: 500 11px/1 "Source Sans 3", "Helvetica Neue", Arial, sans-serif; letter-spacing: .24em; text-transform: uppercase; color: #2e2e2e; }
body.dark #hint { color: #f4efe6; text-shadow: 0 1px 3px #000, 0 0 10px rgba(0,0,0,.8); } body.dark .tools button { text-shadow: 0 1px 3px #000; } body.dark .tools button { color: #b9b2a6; } body.dark .tools button:hover { color: #fff; }
#win, #ferns { display: none !important; }
/* the picture sits in a window cut in a mount; the window changes shape as the story goes on */
#win { position: fixed; left: 0; top: 0; width: 10px; height: 10px; z-index: 1; pointer-events: none; box-sizing: border-box; overflow: hidden;
  box-shadow: 0 2px 12px rgba(70, 45, 25, .35), 0 0 0 300vmax #e8ceb7; border: 0 solid transparent; }
#win.land { border-image: url(frame.jpg) 70 60 72 74 stretch; }
#arch { position: absolute; inset: 0; background-size: 100% 100%; transform: translateY(-104%); transition: transform 1.4s cubic-bezier(.3,.7,.2,1); }
#arch.in { transform: none; }
/* the ferns along the bottom of the painting, laid over everything (multiplied, so only their dark strokes show) */
#ferns { position: fixed; z-index: 1; pointer-events: none; background: url(ferns.jpg) center / 100% 100%; mix-blend-mode: multiply; opacity: 0; }
#stage canvas { display: block; touch-action: none; outline: none; }
#stage canvas:focus-visible { outline: 2px dashed var(--soft); outline-offset: -6px; }
#ink { position: fixed; inset: 0; pointer-events: none; }
#loading { position: fixed; inset: 0; display: grid; place-items: center; font: 400 28px var(--hand); color: var(--soft); }
.tools {
  position: fixed; z-index: 2; display: flex; gap: 14px;
  top: calc(env(safe-area-inset-top, 0px) + 10px); right: max(16px, env(safe-area-inset-right, 0px));
}
.tools button {
  font: italic 500 20px/1 var(--hand); color: var(--soft); background: none; border: 0; padding: 6px 2px; cursor: pointer;
  text-decoration: underline wavy; text-decoration-thickness: 1px; text-underline-offset: 5px;
}
.tools button:hover { color: var(--ink); }
.tools button:focus-visible { outline: 2px dashed var(--soft); outline-offset: 3px; }
#hint {
  position: fixed; z-index: 2; left: 0; right: 0; text-align: center; pointer-events: none;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 22px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  font: italic 500 23px/1.15 var(--hand); color: #4a3a28; transition: opacity .6s; text-wrap: balance;
}
#cfg {
  position: fixed; z-index: 5; left: 0; right: 0; bottom: 0; height: min(62vh, 560px); display: none; flex-direction: column; gap: 8px;
  padding: 12px max(14px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 12px) max(14px, env(safe-area-inset-left, 0px));
  background: #f4e8c8; border-top: 1px solid #b89a5a; box-shadow: 0 -8px 30px rgba(60, 40, 10, .18); color: #3a2a18;
}
#cfg.open { display: flex; }
#cfg .tabs { display: flex; gap: 6px; }
#cfg .tabs button[aria-selected="false"] { background: transparent; border-color: transparent; color: #6b573a; }
#cfgOdds, #cfgJson { flex: 1; min-height: 0; }
#cfgOdds { overflow-y: auto; padding-right: 4px; }
#cfgJson { display: flex; flex-direction: column; gap: 8px; }
#cfgJson[hidden], #cfgOdds[hidden] { display: none; }
#cfgOdds h3 { font: italic 600 19px/1.2 var(--hand); margin: 14px 0 2px; }
#cfgOdds h3:first-child { margin-top: 2px; }
#cfgOdds .note { font: italic 400 15px/1.25 var(--hand); color: #6b573a; margin: 0 0 6px; }
#cfgOdds .odd { display: grid; grid-template-columns: 7.2em 1fr 3.2em; align-items: center; gap: 10px; min-height: 40px; }
#cfgOdds .odd label { font: italic 500 18px/1.1 var(--hand); }
#cfgOdds .odd output { font: 600 14px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; text-align: right; font-variant-numeric: tabular-nums; }
#cfgOdds .odd.off label, #cfgOdds .odd.off output { color: #a08c66; }
#cfgOdds input[type=range] { width: 100%; height: 28px; margin: 0; accent-color: #8a4a2a; touch-action: pan-y; }
#cfgOdds .bar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; margin: 4px 0 8px; background: #e2cd96; }
#cfgOdds .bar i { display: block; height: 100%; }
#cfg header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
#cfg h2 { font: italic 600 22px/1 var(--hand); margin: 0; }
#cfg p { font: italic 400 16px/1.25 var(--hand); margin: 0; color: #6b573a; }
#cfg textarea {
  flex: 1; min-height: 0; width: 100%; box-sizing: border-box; resize: none; padding: 10px; border: 1px solid #b89a5a; border-radius: 6px;
  background: #fbf4df; color: #2c1c10; font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; tab-size: 2; white-space: pre; overflow: auto;
  -webkit-user-select: text; user-select: text;
}
#cfg textarea:focus-visible { outline: 2px solid #8a6a2a; outline-offset: 1px; }
#cfg .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
#cfg button { font: italic 600 19px/1 var(--hand); color: #3a2a18; background: #ead9ad; border: 1px solid #b89a5a; border-radius: 6px; padding: 8px 14px; cursor: pointer; }
#cfg button:hover { background: #e2cd96; }
#cfg button:focus-visible { outline: 2px solid #8a6a2a; outline-offset: 2px; }
#cfgMsg { font: italic 500 16px/1.2 var(--hand); color: #6b573a; flex: 1; min-width: 12ch; }
#cfgMsg.bad { color: #9a2b1a; }
@media (min-width: 760px) { #cfg { left: auto; top: 0; bottom: 0; height: auto; width: 440px; border-top: 0; border-left: 1px solid #b89a5a; padding-top: 16px; } }
#talk { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
.say {
  position: absolute; left: 0; top: 0; box-sizing: border-box; width: max-content; max-width: min(62vw, 250px); padding: 11px 15px 12px;
  background: #fff; color: #1b1a18; border: 1.5px solid #1b1a18; border-radius: 17px;
  font: italic 500 18px/1.18 var(--hand); text-wrap: pretty; transform-origin: 0 100%; opacity: 0; transition: opacity .35s;
}
.say::after { /* the little dark tail at the corner nearest the speaker */
  content: ""; position: absolute; left: 1px; bottom: -8px; border: 6px solid transparent; border-top-color: #1b1a18; border-left-color: #1b1a18;
}
.say.flip { transform-origin: 100% 100%; }
.say.flip::after { left: auto; right: 1px; border-left-color: transparent; border-right-color: #1b1a18; }
.say .w { display: inline-block; white-space: nowrap; }
.say .l { display: inline-block; will-change: opacity, transform; }
#hint .w { display: inline-block; white-space: nowrap; }
#hint .l { display: inline-block; will-change: opacity, transform; }
</style>

<div id="stage"></div>
<nav id="site" aria-label="Site"><a id="back" href="../../index.html">Back</a><span id="kind">Postcard</span></nav>
<canvas id="ink" aria-hidden="true"></canvas>
<div id="win" aria-hidden="true"><div id="arch"></div></div>
<div id="ferns" aria-hidden="true"></div>
<div id="loading">folding paper…</div>
<div class="tools">
  <button id="snd" type="button" aria-pressed="true">sound on</button>
  <button id="again" type="button">start over</button>
  <button id="cfgBtn" type="button" aria-expanded="false" aria-controls="cfg">edit</button>
</div>
<section id="cfg" aria-label="Settings">
  <header>
    <div class="tabs" role="tablist" aria-label="Settings view">
      <button id="tabOdds" type="button" role="tab" aria-selected="true" aria-controls="cfgOdds">Percentages</button>
      <button id="tabJson" type="button" role="tab" aria-selected="false" aria-controls="cfgJson">All settings</button>
    </div>
    <button id="cfgClose" type="button">close</button>
  </header>
  <div id="cfgOdds" role="tabpanel" aria-labelledby="tabOdds"></div>
  <div id="cfgJson" role="tabpanel" aria-labelledby="tabJson" hidden>
    <p>Every setting as JSON. Valid changes apply as you type. Odds are shares: they needn’t add up to 1, and 0 switches a thing off.</p>
    <textarea id="cfgText" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-label="Settings as JSON"></textarea>
  </div>
  <div class="row"><span id="cfgMsg" role="status"></span><button id="cfgCopy" type="button">copy</button><button id="cfgReset" type="button">defaults</button></div>
</section>
<div id="talk" aria-live="polite"></div>
<div id="hint" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/core.js"></script>
<script src="js/environment-sequence.js"></script>
<script src="js/cell-sequence.js"></script>
<script src="js/jali-sequence.js"></script>
<script src="js/transitions.js"></script>
<script src="js/shader.js"></script>
<script src="js/cell-bugs.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body></html>
